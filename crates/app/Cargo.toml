[package]
name = "tesela-app"
description = "Ejecutable de Tesela (tesela.exe): ventana eframe con wgpu solo DX12, manifiesto y configuracion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tesela"
path = "src/main.rs"

[features]
# Capturas de la ventana (`--screenshot ruta.png`) para el README. No forma parte del ejecutable que se publica.
capture = ["dep:png"]

[dependencies]
tesela-ui.workspace = true
eframe.workspace = true
serde.workspace = true
toml.workspace = true
wgpu.workspace = true
png = { workspace = true, optional = true }

[dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading"]

[build-dependencies]
embed-manifest.workspace = true
# El icono se dibuja en build.rs (el repositorio no versiona imagenes).
png.workspace = true
winresource.workspace = true

[dev-dependencies]
uuid.workspace = true

[lints]
workspace = true
