# MVP cleanup rules (PLAN.md §2.6). Each category has a risk, destination, and optional minimum age.
#
#   risk        safe (may be preselected) | review (never preselected) | info (display only, no checkbox)
#   destination permanent (delete; only rule-classified regenerable data) | recycle
#   action      contents   = delete CHILDREN of category roots (leave the roots intact)
#               empty-bin  = empty the Recycle Bin within the enumerated scope
#               none       = no action (show information or offer "View")
#   min_age_hours  touch only files older than this (latest creation, write, or change time)
#   selectable  has a checkbox in Recommendations
#
# Explanations live in the UI (es.ftl / en.ftl), keyed as `rule-<id>-why`.
# A test checks these invariants: safe data is regenerable and deleted under a rule; review is never preselected;
# info has no destination or action.

[[rule]]
id = "user-temp"
risk = "safe"
destination = "permanent"
action = "contents"
min_age_hours = 168
selectable = true

[[rule]]
id = "windows-temp"
risk = "safe"
destination = "permanent"
action = "contents"
min_age_hours = 168
selectable = true

[[rule]]
id = "chrome-cache"
risk = "safe"
destination = "permanent"
action = "contents"
min_age_hours = 0
selectable = true

[[rule]]
id = "edge-cache"
risk = "safe"
destination = "permanent"
action = "contents"
min_age_hours = 0
selectable = true

[[rule]]
id = "firefox-cache"
risk = "safe"
destination = "permanent"
action = "contents"
min_age_hours = 0
selectable = true

[[rule]]
id = "recycle-bin"
risk = "review"
destination = "permanent"
action = "empty-bin"
min_age_hours = 0
selectable = true

# Downloads: informational (Review). "View" opens the folder; user-selected entries enter the basket as
# "Your file" (Recycle Bin). Downloads are never "safe".
[[rule]]
id = "downloads"
risk = "review"
destination = "recycle"
action = "none"
min_age_hours = 0
selectable = false

# Current user's Windows Error Reporting (WER): ONLY the two report folders under
# %LOCALAPPDATA%\Microsoft\Windows\WER: `ReportArchive` (sent reports retained by WER) and `ReportQueue` (pending).
# Never the `WER` parent or other contents. Review risk and Recycle Bin destination: reports can diagnose failures
# and support staff may request them. They are NOT regenerable; permanent deletion stays limited to regenerable data.
# If they do not fit in the Recycle Bin, keep them: diagnostics are never permanently deleted. Minimum age is 7 days;
# recent reports may describe a failure the user wants to inspect or submit.
# Sources (reviewed 2026-10-17; revisit within one year or sooner if WER changes):
#   - https://learn.microsoft.com/en-us/windows/win32/wer/wer-settings (ms.date 2021-03-12): archive and queue limits
#     (default MaxArchiveCount 1000, MaxQueueCount 50).
#   - https://learn.microsoft.com/en-us/windows-server/failover-clustering/troubleshooting-using-wer-reports (ms.date
#     2021-10-21): queue contains pending reports; archive contains sent reports, including `Report.wer`.
#   - https://learn.microsoft.com/en-us/archive/blogs/oanapl/windows-error-reporting-wer-for-developers (archived 2009):
#     per-user `%LOCALAPPDATA%\Microsoft\Windows\WER` path with `ReportArchive` and `ReportQueue`.
[[rule]]
id = "wer-reports"
risk = "review"
destination = "recycle"
action = "contents"
min_age_hours = 168
selectable = true

# Application crash dumps: WER's default local dump folder, `%LOCALAPPDATA%\CrashDumps`.
# Same policy: Review, Recycle Bin, and 7-day minimum age (yesterday's dump may be needed for support).
# A full dump can be gigabytes; if it does not fit in the Recycle Bin, keep it.
# Only the default path: do not touch a redirected `DumpFolder` (HKLM configuration requires an administrator).
# Source (reviewed 2026-10-17; revisit within one year):
#   - https://learn.microsoft.com/en-us/windows/win32/wer/collecting-user-mode-dumps (ms.date 2024-07-18): default
#     `DumpFolder` is `%LOCALAPPDATA%\CrashDumps`; default `DumpCount` is 10 (oldest replaced) and `DumpType` is 1
#     (mini). The feature is disabled by default, so the folder may not exist.
[[rule]]
id = "crash-dumps"
risk = "review"
destination = "recycle"
action = "contents"
min_age_hours = 168
selectable = true

