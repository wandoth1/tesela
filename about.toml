# `cargo about` configuration (generates THIRD-PARTY-NOTICES.md from about.hbs). Regenerate with:
#   cargo about generate --locked -o THIRD-PARTY-NOTICES.md about.hbs
# Covers only the shipped product (Windows x64, excluding development and build dependencies); accepted licenses
# match `deny.toml`.
accepted = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "ISC",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
