# Workspace del producto. El spike de la fase 0 (`spike/`) es un workspace propio e independiente.
[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/scanner",
    "crates/layout",
    "crates/cleaner",
    "crates/update",
    "crates/ui",
    "crates/app",
    "crates/tesela-scan",
]
exclude = ["spike"]

[workspace.package]
version = "0.1.6"
edition = "2024"
# MSRV: la fija egui (PLAN.md §1). Se comprueba con `cargo +1.95 check --workspace`.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wandoth1/tesela"
publish = false

[workspace.dependencies]
# Versiones verificadas con `cargo search` el 2026-10-15 (coinciden con PLAN.md §3.10).
crossbeam-channel = "0.5.17"
crossbeam-deque = "0.8.8"
dunce = "1.0.5"
embed-manifest = "1.5.1"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "wgpu_no_default_features"] }
# Sin `default_fonts`: no se redistribuye ninguna fuente dentro del .exe (se usan las del sistema, PLAN.md §2.10).
egui = { version = "0.37.0", default-features = false }
egui_kittest = "0.36.2"
fluent-bundle = "0.16.0"
png = "0.18.1"
rfd = { version = "0.17.2", default-features = false }
raw-window-handle = { version = "0.6", default-features = false }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
toml = "1.1.8"
unic-langid = "0.9.6"
uuid = { version = "1.28.0", features = ["v4"] }
# wgpu solo con DX12 (PLAN.md §1; mismas features que spike/ui-treemap, feature wgpu-dx12).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
windows-sys = "0.61.2"
# Recurso de Windows (icono y VERSIONINFO) del .exe; solo dependencia de compilacion (build.rs). Necesita rc.exe del Windows SDK.
winresource = { version = "0.1.34", default-features = false }
# COM (IFileOperation, la Papelera) del cleaner: ya está en el árbol (accesskit, wgpu); solo con las features que se usan.
windows = { version = "0.62.2", default-features = false }
# La macro `#[implement]` (el receptor de eventos de IFileOperation) genera rutas `windows_core::...`: hace falta el crate directo.
windows-core = "0.62.2"

# Crates internos.
tesela-model = { version = "0.1.6", path = "crates/model" }
tesela-scanner = { version = "0.1.6", path = "crates/scanner" }
tesela-layout = { version = "0.1.6", path = "crates/layout" }
tesela-cleaner = { version = "0.1.6", path = "crates/cleaner" }
tesela-update = { version = "0.1.6", path = "crates/update" }
tesela-ui = { version = "0.1.6", path = "crates/ui" }

[workspace.lints.rust]
# Todo `unsafe` está confinado a módulos pequeños que lo permiten expresamente (`#![allow(unsafe_code)]`).
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
