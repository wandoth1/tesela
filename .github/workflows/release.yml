name: Release

# Runs when a `v*` tag is pushed. It NEVER publishes by itself: it creates a GitHub Release draft with the MSI, portable
# zip, and SHA256SUMS.txt. A person publishes it after verification (download, check SHA-256, run `gh attestation verify`,
# test the MSI) using "Publish release" or `gh release edit vX.Y.Z --draft=false`.
#
# Design (four jobs with separate permissions; see also installer/README.md, "Before the first release"):
#   build    contents: read. Checks the tag and privacy, builds with scripts/build-msi.ps1, and uploads the files as an
#            artifact. It cannot write to the repository or sign anything.
#   attest   ONLY id-token: write + attestations: write. No checkout or repository code execution: downloads the artifact
#            and attests the provenance (SLSA) of the three files.
#   verify   ONLY attestations: read (+ contents: read). No checkout: downloads the artifact and VERIFIES each file's
#            attestation with `gh attestation verify --signer-workflow --source-ref`. It also runs in the dry run.
#   release  ONLY contents: write, and only after `verify`. No checkout: downloads the artifact and creates the draft with
#            `gh release create --draft` (no third-party actions).
#
# Dry run (`workflow_dispatch`, `dry_run=true` by default, ONLY from main): "Run workflow" runs build, attest, and verify
# WITHOUT checking the tag and WITHOUT the release job: it cannot publish anything, even a draft (release requires a tag push).
# A real tag uses the normal flow.
#
# How to publish a version:
#   1. Change the version in Cargo.toml ([workspace.package]) and add its section to CHANGELOG.md; commit and merge to main.
#   2. (Optional) Run a dry run: Actions > Release > Run workflow on main, with dry_run checked.
#   3. git tag vX.Y.Z <main commit> && git push origin vX.Y.Z      (the tag must match Cargo.toml)
#   4. Review the draft and publish it. To rerun with the same name, delete the draft first (`gh release delete`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and attest without checking the tag or creating the release (only true is accepted)"
        type: boolean
        default: true

# No default permissions: each job requests only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Pinned WiX version (same as scripts/build-msi.ps1, scripts/install-wix.ps1, and ci.yml; checked by scripts/tests/wix-version.tests.ps1).
  WIX_VERSION: "5.0.2"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # A workflow_dispatch NEVER publishes (only a dry run is accepted) and dry runs are allowed only from main.
      - name: Only allow workflow_dispatch dry runs
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        shell: bash
        run: |
          echo "::error::workflow_dispatch only accepts dry_run=true. To publish, push a vX.Y.Z tag (see the release.yml header)."
          exit 1
      - name: Allow dry runs only from main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Dry runs (workflow_dispatch) run only from main; this run started from $REF. Select main in Use workflow from."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # With no arguments, installs the toolchain from rust-toolchain.toml (does not rely on cargo's first-run auto-install).
      # No rust-cache by design: each release is built from scratch, without a cache another run could have poisoned.
      - name: Install the rust-toolchain.toml toolchain
        run: rustup toolchain install

      # The tag (vX.Y.Z) must match the Cargo.toml version and point to a commit on main.
      - name: Check that the tag matches Cargo.toml and is on main
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "tag '$env:TAG' is not in vX.Y.Z format (suffixes such as -rc1 are not supported in an MSI)" }
          $tagVersion = $Matches[1]
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $versions = @($meta.packages | ForEach-Object { $_.version } | Sort-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -ne $tagVersion) {
            throw "tag version is $tagVersion but Cargo.toml says $($versions -join ', ')"
          }
          git merge-base --is-ancestor $env:SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag commit ($env:SHA) is not on main; releases must come from main" }
          Write-Host "tag $env:TAG = version $tagVersion, on main"

      # Same as privacy-history in ci.yml: for a tag, `before` is all zeros, so the full history up to this commit is checked.
      - name: privacy-check (history messages and blobs)
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          $to = (git rev-parse "$($env:PUSH_AFTER)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "could not resolve $env:PUSH_AFTER to a commit" }
          Write-Host "range: $env:PUSH_BEFORE .. $to"
          ./scripts/privacy-check.ps1 -GenericOnly -From $env:PUSH_BEFORE -To $to
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: privacy-check (entire tree)
        shell: pwsh
        run: ./scripts/privacy-check.ps1 -All -GenericOnly

      # With the version pinned, use only nuget.org (installer/nuget.config) and verify the package SHA-512.
      - name: Install WiX
        shell: pwsh
        run: ./scripts/install-wix.ps1 -Version $env:WIX_VERSION
      # build-release.ps1 (static CRT, --locked, reproducible, no machine paths, PE imports) + MSI + zip + SHA256SUMS.txt + validation.
      - name: Build the MSI, zip, and checksums
        shell: pwsh
        run: ./scripts/build-msi.ps1 -OutDir "$env:RUNNER_TEMP/dist"

      # --- SignPath Foundation signing: DISABLED until the project is accepted ------------------------------------------
      # To enable it (see CODE_SIGNING.md): 1) after SignPath approval, add the SIGNPATH_API_TOKEN and
      # SIGNPATH_ORGANIZATION_ID repository secrets and set SIGNPATH_ENABLED=true; 2) fill in project-slug,
      # signing-policy-slug, and artifact-configuration-slug with their SignPath values; 3) remove `false &&` from the `if`s;
      # 4) configure the SignPath artifact to sign tesela.exe and tesela-scan.exe (the portable zip files) AND the MSI
      # (ideally sign the .exe files first, rebuild the MSI with them, then sign the MSI; see CODE_SIGNING.md). The steps
      # below sign the built MSI AND both .exe files in the zip (extract, sign, and repackage the zip), revalidate the
      # signed MSI with Test-MsiPackage (signing must not change its tables), and recalculate SHA256SUMS.txt AFTER signing
      # (the `attest` job covers the signed files). When enabling this, also review action v3 (this is v2.x) and pin its SHA.
      # The release-note warning that the build is unsigned disappears ONLY if the final signing step runs
      # (it sets RELEASE_SIGNED=true in the job environment); while signing is disabled, the warning is always shown.
      # This file contains no secrets.
      - name: SignPath - prepare files to sign (MSI and zip executables)
        if: ${{ false && vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          $unsigned = Join-Path $env:RUNNER_TEMP 'unsigned'
          New-Item -ItemType Directory -Force -Path $unsigned | Out-Null
          $msi = @(Get-ChildItem -LiteralPath $dist -Filter '*.msi')
          $zip = @(Get-ChildItem -LiteralPath $dist -Filter '*.zip')
          if ($msi.Count -ne 1 -or $zip.Count -ne 1) { throw 'expected exactly one MSI and one zip' }
          Copy-Item -LiteralPath $msi[0].FullName -Destination $unsigned
          $x = Join-Path $env:RUNNER_TEMP 'zip-unsigned'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $x
          foreach ($e in 'tesela.exe', 'tesela-scan.exe') {
            $f = @(Get-ChildItem -LiteralPath $x -Recurse -Filter $e)
            if ($f.Count -ne 1) { throw "the zip does not contain exactly one $e" }
            Copy-Item -LiteralPath $f[0].FullName -Destination $unsigned
          }
      - name: SignPath - upload files to sign
        if: ${{ false && vars.SIGNPATH_ENABLED == 'true' }}
        id: signpath-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-files
          path: ${{ runner.temp }}/unsigned/*
          if-no-files-found: error
      - name: SignPath - request signing
        if: ${{ false && vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v2.x (v3 is available)
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tesela
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi-and-exes
          github-artifact-id: ${{ steps.signpath-unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed
      - name: SignPath - replace MSI and zip executables, revalidate, and recalculate checksums
        if: ${{ false && vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          $signedDir = Join-Path $env:RUNNER_TEMP 'signed'
          $signed = @(Get-ChildItem -LiteralPath $signedDir -Filter '*.msi')
          if ($signed.Count -ne 1) { throw 'SignPath did not return exactly one MSI' }
          # Every output file must have a valid Authenticode signature.
          foreach ($f in @($signed[0]) + @(Get-ChildItem -LiteralPath $signedDir -Filter '*.exe')) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) does not have a valid signature: $($sig.Status)" }
          }
          # Validate the signed MSI with the same rules as the unsigned MSI (signing should not change its tables; verify it).
          # The expected version comes from the package itself.
          . ./scripts/msi-validate.ps1
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          $problems = Test-MsiPackage -Path $signed[0].FullName -ExpectedVersion $version
          if ($problems.Count -gt 0) { throw ('the signed MSI failed validation: ' + ($problems -join '; ')) }
          Copy-Item -LiteralPath $signed[0].FullName -Destination (Join-Path $dist $signed[0].Name) -Force
          # Portable zip: extract it, replace ONLY the two .exe files with their signed versions (same names and folders),
          # then repackage it with the same structure.
          $zip = @(Get-ChildItem -LiteralPath $dist -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'expected exactly one zip' }
          $x = Join-Path $env:RUNNER_TEMP 'zip-signed'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $x
          foreach ($e in 'tesela.exe', 'tesela-scan.exe') {
            $dst = @(Get-ChildItem -LiteralPath $x -Recurse -Filter $e)
            $src = Join-Path $signedDir $e
            if ($dst.Count -ne 1 -or -not (Test-Path -LiteralPath $src)) { throw "signed $e is missing or absent from the zip" }
            Copy-Item -LiteralPath $src -Destination $dst[0].FullName -Force
          }
          $top = @(Get-ChildItem -LiteralPath $x -Directory)
          if ($top.Count -ne 1) { throw 'the zip must have exactly one top-level folder' }
          Remove-Item -LiteralPath $zip[0].FullName -Force
          Compress-Archive -LiteralPath $top[0].FullName -DestinationPath $zip[0].FullName -CompressionLevel Optimal
          $lines = Get-ChildItem -LiteralPath $dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [System.IO.File]::WriteAllText((Join-Path $dist 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          # Signing completed: the release notes no longer say the release is unsigned.
          "RELEASE_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Release notes: the version section from CHANGELOG.md, plus verification instructions.
      - name: Release notes
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          $lines = Get-Content -LiteralPath CHANGELOG.md -Encoding utf8
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^##\s+\[?' + [regex]::Escape($version) + '\]?(\s|$)')) { $start = $i + 1; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section '## [$version]'" }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start; $i -lt $lines.Count -and $lines[$i] -notmatch '^##\s'; $i++) { $body.Add($lines[$i]) }
          $text = ($body -join "`n").Trim()
          if (-not $text) { throw "CHANGELOG.md section $version is empty" }
          $sums = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dist/SHA256SUMS.txt') -Raw).TrimEnd()
          # Remove the unsigned warning only when the signing step ran (RELEASE_SIGNED); while disabled, always show it.
          $signedNote = if ($env:RELEASE_SIGNED -eq 'true') { 'This version is signed (SignPath Foundation).' } else { 'This version is **not signed** yet: Windows SmartScreen may show a warning.' }
          $notes = @(
            $text, '',
            '## Verify the download', '',
            '```', $sums, '```', '',
            "``gh attestation verify <file> --repo wandoth1/tesela`` verifies the build provenance. $signedNote Installation, download verification, SmartScreen guidance, and uninstall details: [README, Installation section](https://github.com/wandoth1/tesela#installation).")
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'dist/RELEASE-NOTES.md'), (($notes -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            ${{ runner.temp }}/dist/*.msi
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/SHA256SUMS.txt
            ${{ runner.temp }}/dist/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

  # Requests only the attestation permissions. It does not check out or run repository code.
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Sign the attestation with Sigstore (OIDC)
      attestations: write # Store the attestation in the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # Provenance (SLSA) of the published files: `gh attestation verify <file> --repo wandoth1/tesela`.
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-files/*.msi
            release-files/*.zip
            release-files/SHA256SUMS.txt

  # Verifies every file's attestation before publishing anything, including in dry runs. Read-only (attestations: read is
  # required by the attestations endpoint for `gh attestation verify`); no checkout or repository code execution.
  # Each file must be signed by THIS workflow, from THIS repository, and for the SAME ref that triggered the run (the tag
  # for a release; main for a dry run).
  verify:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Verify each file's attestation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cd release-files
          for f in ./*.msi ./*.zip ./SHA256SUMS.txt; do
            echo "verifying $f"
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "$REF"
          done

  # ONLY this job can write to the repository. It does not check out or run repository code and only runs for a tag push
  # after attestation verification: workflow_dispatch (dry runs) cannot reach this job.
  release:
    needs: [build, attest, verify]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Create the GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-files
          ls -la
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
            --title "Tesela ${TAG#v}" --notes-file RELEASE-NOTES.md \
            ./*.msi ./*.zip ./SHA256SUMS.txt
