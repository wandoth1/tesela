name: Release

# Se dispara al empujar una etiqueta `v*`. NUNCA publica nada por sí solo: crea una GitHub Release en BORRADOR (draft) con
# el MSI, el zip portable y SHA256SUMS.txt. La publica una persona, después de verificarla (descargar, comprobar el
# SHA-256, `gh attestation verify`, probar el MSI) con "Publish release" o `gh release edit vX.Y.Z --draft=false`.
#
# Diseño (cuatro jobs, permisos separados; ver también installer/README.md, "Antes de la primera release"):
#   build    contents: read. Comprueba etiqueta y privacidad, construye con scripts/build-msi.ps1 y sube los archivos como
#            artefacto. No puede escribir en el repositorio ni firmar nada.
#   attest   SOLO id-token: write + attestations: write. No hace checkout ni ejecuta código del repositorio: descarga el
#            artefacto y atesta la procedencia (SLSA) de los tres archivos.
#   verify   SOLO attestations: read (+ contents: read). Sin checkout: descarga el artefacto y VERIFICA la attestation de cada
#            archivo con `gh attestation verify --signer-workflow --source-ref`. Corre tambien en el ensayo.
#   release  SOLO contents: write, y solo tras `verify`. Tampoco hace checkout: descarga el artefacto y crea el borrador con
#            `gh release create --draft` (sin acciones de terceros).
#
# Ensayo (workflow_dispatch, dry_run=true por defecto, SOLO desde main): "Run workflow" ejecuta build, attest y verify SIN la comprobación
# de etiqueta y SIN el job release: no puede publicar nada, ni siquiera en borrador (release exige un push de etiqueta).
# Con una etiqueta real el flujo es el de siempre.
#
# Cómo se publica una versión:
#   1. Cambia la versión en Cargo.toml ([workspace.package]) y añade su sección a CHANGELOG.md; commit y merge a main.
#   2. (Opcional) Ensáyalo: Actions > Release > Run workflow en main, con dry_run marcado.
#   3. git tag vX.Y.Z <commit de main> && git push origin vX.Y.Z      (la etiqueta tiene que coincidir con Cargo.toml)
#   4. Revisa el borrador, y publícalo. Si hay que relanzar con el mismo nombre, borra antes el borrador (gh release delete).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ensayo: construye y atesta, sin comprobar la etiqueta ni crear la release (solo se admite true)"
        type: boolean
        default: true

# Nada por defecto: cada job pide lo que necesita.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Versión FIJADA de WiX (la misma que scripts/build-msi.ps1, scripts/install-wix.ps1 y ci.yml; scripts/tests/wix-version.tests.ps1 lo comprueba).
  WIX_VERSION: "5.0.2"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Un workflow_dispatch NUNCA publica (solo se admite el ensayo) y solo se ensaya desde main.
      - name: Solo se admite el ensayo con workflow_dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        shell: bash
        run: |
          echo "::error::workflow_dispatch solo admite dry_run=true. Para publicar, empuja una etiqueta vX.Y.Z (ver la cabecera de release.yml)."
          exit 1
      - name: El ensayo solo se ejecuta desde main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::El ensayo (workflow_dispatch) solo se ejecuta desde main; se lanzo desde $REF. Elige main en Use workflow from."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Sin argumentos instala el toolchain de rust-toolchain.toml (no se fía de la autoinstalación de la primera cargo).
      # Sin rust-cache a propósito: un release se compila desde cero (nada de una caché que pudo envenenar otra ejecución).
      - name: Instalar el toolchain de rust-toolchain.toml
        run: rustup toolchain install

      # La etiqueta (vX.Y.Z) tiene que ser la versión de Cargo.toml, y apuntar a un commit de main.
      - name: La etiqueta coincide con Cargo.toml y está en main
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "la etiqueta '$env:TAG' no tiene la forma vX.Y.Z (los sufijos como -rc1 no caben en un MSI)" }
          $tagVersion = $Matches[1]
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata fallo' }
          $versions = @($meta.packages | ForEach-Object { $_.version } | Sort-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -ne $tagVersion) {
            throw "la etiqueta dice $tagVersion y Cargo.toml dice $($versions -join ', ')"
          }
          git merge-base --is-ancestor $env:SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "el commit de la etiqueta ($env:SHA) no está en main: un release sale de main" }
          Write-Host "etiqueta $env:TAG = versión $tagVersion, en main"

      # Igual que privacy-history de ci.yml: en una etiqueta, `before` son ceros y se revisa TODA la historia hasta el commit.
      - name: privacy-check (mensajes y blobs de la historia)
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          $to = (git rev-parse "$($env:PUSH_AFTER)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "no se pudo resolver $env:PUSH_AFTER a un commit" }
          Write-Host "rango: $env:PUSH_BEFORE .. $to"
          ./scripts/privacy-check.ps1 -GenericOnly -From $env:PUSH_BEFORE -To $to
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: privacy-check (todo el árbol)
        shell: pwsh
        run: ./scripts/privacy-check.ps1 -All -GenericOnly

      # Con la versión fijada, solo nuget.org (installer/nuget.config) y comprobando el SHA-512 del paquete.
      - name: Instalar WiX
        shell: pwsh
        run: ./scripts/install-wix.ps1 -Version $env:WIX_VERSION
      # build-release.ps1 (CRT estático, --locked, reproducible, sin rutas de la máquina, imports PE) + MSI + zip +
      # SHA256SUMS.txt + validación.
      - name: Construir el MSI, el zip y las sumas de verificación
        shell: pwsh
        run: ./scripts/build-msi.ps1 -OutDir "$env:RUNNER_TEMP/dist"

      # --- Firma con SignPath Foundation: DESACTIVADA hasta que el proyecto sea aceptado ---------------------------------
      # Para activarla (ver CODE_SIGNING.md): 1) tras la aprobación de SignPath, crea en el repositorio los secretos
      # SIGNPATH_API_TOKEN y SIGNPATH_ORGANIZATION_ID y la variable SIGNPATH_ENABLED=true; 2) rellena project-slug,
      # signing-policy-slug y artifact-configuration-slug con los de SignPath; 3) quita `false &&` de los `if`;
      # 4) la configuración de artefacto de SignPath debe firmar tesela.exe y tesela-scan.exe (los del zip portable) Y el MSI
      # (lo ideal es firmar primero los .exe, reconstruir el MSI con ellos y firmar el MSI: ver CODE_SIGNING.md). Los pasos
      # de abajo firman el MSI ya construido Y los dos .exe del zip (se extraen, se firman y se vuelve a empaquetar el zip),
      # vuelven a VALIDAR el MSI firmado con Test-MsiPackage (la firma no puede haber cambiado sus tablas) y vuelven a
      # calcular SHA256SUMS.txt DESPUÉS de firmar (la attestation del job `attest` cubre lo firmado). Al activarlo, mira
      # también la v3 de la acción (esta es la 2.x); y fija el SHA de la que uses.
      # El aviso "no está firmada todavía" de las notas de la release SOLO desaparece si el último paso de firma se ejecutó
      # (deja RELEASE_SIGNED=true en el entorno del job): mientras la firma esté desactivada, el aviso sale siempre.
      # No hay ningún secreto en este archivo.
      - name: SignPath - preparar lo que se firma (el MSI y los .exe del zip)
        if: ${{ false && vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          $unsigned = Join-Path $env:RUNNER_TEMP 'unsigned'
          New-Item -ItemType Directory -Force -Path $unsigned | Out-Null
          $msi = @(Get-ChildItem -LiteralPath $dist -Filter '*.msi')
          $zip = @(Get-ChildItem -LiteralPath $dist -Filter '*.zip')
          if ($msi.Count -ne 1 -or $zip.Count -ne 1) { throw 'se esperaba exactamente un MSI y un zip' }
          Copy-Item -LiteralPath $msi[0].FullName -Destination $unsigned
          $x = Join-Path $env:RUNNER_TEMP 'zip-unsigned'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $x
          foreach ($e in 'tesela.exe', 'tesela-scan.exe') {
            $f = @(Get-ChildItem -LiteralPath $x -Recurse -Filter $e)
            if ($f.Count -ne 1) { throw "el zip no tiene exactamente un $e" }
            Copy-Item -LiteralPath $f[0].FullName -Destination $unsigned
          }
      - name: SignPath - subir lo que se firma
        if: ${{ false && vars.SIGNPATH_ENABLED == 'true' }}
        id: signpath-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-files
          path: ${{ runner.temp }}/unsigned/*
          if-no-files-found: error
      - name: SignPath - pedir la firma
        if: ${{ false && vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.x (hay una v3)
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tesela
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi-and-exes
          github-artifact-id: ${{ steps.signpath-unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed
      - name: SignPath - sustituir el MSI y los .exe del zip, revalidar y recalcular las sumas
        if: ${{ false && vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          $signedDir = Join-Path $env:RUNNER_TEMP 'signed'
          $signed = @(Get-ChildItem -LiteralPath $signedDir -Filter '*.msi')
          if ($signed.Count -ne 1) { throw 'SignPath no devolvio exactamente un MSI' }
          # Todo lo que sale tiene que llevar una firma valida (Authenticode).
          foreach ($f in @($signed[0]) + @(Get-ChildItem -LiteralPath $signedDir -Filter '*.exe')) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) no lleva una firma valida: $($sig.Status)" }
          }
          # El MSI firmado se vuelve a validar con las mismas reglas que el sin firmar (la firma no toca las tablas, pero esto
          # lo comprueba en vez de suponerlo). La version esperada es la del propio paquete.
          . ./scripts/msi-validate.ps1
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          $problems = Test-MsiPackage -Path $signed[0].FullName -ExpectedVersion $version
          if ($problems.Count -gt 0) { throw ('el MSI firmado no pasa la validacion: ' + ($problems -join '; ')) }
          Copy-Item -LiteralPath $signed[0].FullName -Destination (Join-Path $dist $signed[0].Name) -Force
          # Zip portable: se extrae, se sustituyen SOLO los dos .exe por los firmados (mismo nombre y misma carpeta) y se
          # vuelve a empaquetar con la misma estructura.
          $zip = @(Get-ChildItem -LiteralPath $dist -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'se esperaba exactamente un zip' }
          $x = Join-Path $env:RUNNER_TEMP 'zip-signed'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $x
          foreach ($e in 'tesela.exe', 'tesela-scan.exe') {
            $dst = @(Get-ChildItem -LiteralPath $x -Recurse -Filter $e)
            $src = Join-Path $signedDir $e
            if ($dst.Count -ne 1 -or -not (Test-Path -LiteralPath $src)) { throw "falta $e firmado o en el zip" }
            Copy-Item -LiteralPath $src -Destination $dst[0].FullName -Force
          }
          $top = @(Get-ChildItem -LiteralPath $x -Directory)
          if ($top.Count -ne 1) { throw 'el zip tiene que tener una sola carpeta raiz' }
          Remove-Item -LiteralPath $zip[0].FullName -Force
          Compress-Archive -LiteralPath $top[0].FullName -DestinationPath $zip[0].FullName -CompressionLevel Optimal
          $lines = Get-ChildItem -LiteralPath $dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [System.IO.File]::WriteAllText((Join-Path $dist 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          # Lo firmado llego hasta aqui: las notas ya no dicen que la release no esta firmada.
          "RELEASE_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Notas de la release: la sección de la versión en CHANGELOG.md, y cómo verificarla.
      - name: Notas de la release
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          $lines = Get-Content -LiteralPath CHANGELOG.md -Encoding utf8
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^##\s+\[?' + [regex]::Escape($version) + '\]?(\s|$)')) { $start = $i + 1; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md no tiene una seccion '## [$version]'" }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start; $i -lt $lines.Count -and $lines[$i] -notmatch '^##\s'; $i++) { $body.Add($lines[$i]) }
          $text = ($body -join "`n").Trim()
          if (-not $text) { throw "la seccion $version de CHANGELOG.md esta vacia" }
          $sums = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dist/SHA256SUMS.txt') -Raw).TrimEnd()
          # El aviso de "sin firmar" solo se quita si el paso de firma se ejecuto (RELEASE_SIGNED); desactivado, siempre sale.
          $signedNote = if ($env:RELEASE_SIGNED -eq 'true') { 'Esta versión está firmada (SignPath Foundation).' } else { 'Esta versión **no está firmada** todavía: Windows SmartScreen puede avisar.' }
          $notes = @(
            $text, '',
            '## Verificar la descarga', '',
            '```', $sums, '```', '',
            "``gh attestation verify <archivo> --repo wandoth1/tesela`` comprueba la procedencia del build. $signedNote Instalación, cómo verificar la descarga, qué hacer con SmartScreen y qué queda al desinstalar: [README, sección Instalación](https://github.com/wandoth1/tesela#instalación).")
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'dist/RELEASE-NOTES.md'), (($notes -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            ${{ runner.temp }}/dist/*.msi
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/SHA256SUMS.txt
            ${{ runner.temp }}/dist/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

  # Solo pide los permisos de la attestation. No hace checkout ni ejecuta código del repositorio.
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # firma de la attestation con Sigstore (OIDC)
      attestations: write # guardar la attestation en el repositorio
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # Procedencia (SLSA) de lo que se publica: `gh attestation verify <archivo> --repo wandoth1/tesela`.
      - name: Attestation de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-files/*.msi
            release-files/*.zip
            release-files/SHA256SUMS.txt

  # Verifica la attestation de CADA archivo antes de publicar nada, y tambien en el ensayo. Solo lee (attestations: read, que
  # es lo que pide el endpoint de attestations para `gh attestation verify`); no hace checkout ni ejecuta codigo del repo.
  # Cada archivo tiene que venir firmado por ESTE workflow, de ESTE repositorio y del MISMO ref que lanzo la ejecucion (la
  # etiqueta en una release; main en el ensayo).
  verify:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Verificar la attestation de cada archivo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cd release-files
          for f in ./*.msi ./*.zip ./SHA256SUMS.txt; do
            echo "verificando $f"
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "$REF"
          done

  # SOLO este job puede escribir en el repositorio. No hace checkout ni ejecuta codigo del repositorio, y solo corre con un
  # push de etiqueta tras verificar las attestations: un workflow_dispatch (el ensayo) no puede llegar aqui.
  release:
    needs: [build, attest, verify]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Crear la GitHub Release en BORRADOR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-files
          ls -la
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
            --title "Tesela ${TAG#v}" --notes-file RELEASE-NOTES.md \
            ./*.msi ./*.zip ./SHA256SUMS.txt
