name: CI

on:
  # Push a CUALQUIER rama y a cualquier etiqueta: nada se publica sin pasar `privacy-history` (aunque no sea un PR ni
  # `main`). Los jobs pesados solo corren en `main`, en etiquetas y en pull requests (ver el `if` de build, msrv y aarch64).
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  schedule:
    # Cada lunes: cargo deny también con los avisos de seguridad nuevos, aunque no haya commits.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Version FIJADA de WiX (la misma que scripts/build-msi.ps1 y release.yml; scripts/tests/wix-version.tests.ps1 lo comprueba).
  WIX_VERSION: "5.0.2"

# Las acciones van fijadas por SHA (el tag, en el comentario); Dependabot propone las actualizaciones.
jobs:
  # Comprueba que el repositorio no contiene datos de ninguna máquina (solo patrones genéricos) y prueba el propio check
  # con PowerShell 7 y con Windows PowerShell 5.1.
  privacy:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: privacy-check (todo el árbol)
        shell: pwsh
        run: ./scripts/privacy-check.ps1 -All -GenericOnly
      # La validación de los imports de los .exe (build-release.ps1) usa scripts/check-pe.py; se prueba con PE sintéticos.
      - name: pruebas de check-pe.py
        shell: pwsh
        run: python -I -m unittest discover -s scripts/tests -p "test_*.py"
      - name: pruebas de leak-scan (valores locales en los binarios)
        shell: pwsh
        run: ./scripts/tests/leak-scan.tests.ps1
      # La version de WiX tiene que ser la misma en build-msi.ps1, ci.yml y release.yml; el UpgradeCode, el mismo en el .wxs y en el script.
      - name: pruebas de la version de WiX y del UpgradeCode
        shell: pwsh
        run: ./scripts/tests/wix-version.tests.ps1
      - name: pruebas de privacy-check (pwsh)
        shell: pwsh
        run: ./scripts/tests/privacy-check.tests.ps1
      - name: pruebas de privacy-check (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/tests/privacy-check.tests.ps1 -Shell powershell

  # El job anterior solo mira el checkout (el árbol final). Este revisa lo que INTRODUCE el push o el pull request: el
  # mensaje de cada commit y TODOS sus blobs, también los que un commit posterior borra (un dato privado que se quita en
  # el commit siguiente sigue estando en la historia pública).
  #  * push: github.event.before..github.sha. Con `before` a ceros (primer push), o ausente del clon (force-push), se
  #    revisa toda la historia hasta github.sha.
  #  * pull_request: base..head (fetch-depth 0 trae los dos extremos).
  #  * push a una rama nueva o a una etiqueta: `before` son ceros, se revisa toda la historia hasta `github.sha`.
  # Los SHA llegan por variables de entorno (nunca interpolados en el script) y el script exige 40 hex; el destino se
  # pela a su commit (`^{commit}`) por si una etiqueta anotada trae el SHA del objeto etiqueta.
  privacy-history:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: privacy-check (mensajes y blobs del rango)
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $from = $env:PR_BASE
            $to = $env:PR_HEAD
          } else {
            $from = $env:PUSH_BEFORE
            $to = $env:PUSH_AFTER
          }
          $to = (git rev-parse "$($to)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "no se pudo resolver $env:PUSH_AFTER a un commit" }
          Write-Host "rango: $from .. $to"
          ./scripts/privacy-check.ps1 -GenericOnly -From $from -To $to
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sin argumentos instala el toolchain de rust-toolchain.toml (no se fía de la autoinstalación de la primera cargo).
      - name: Instalar el toolchain de rust-toolchain.toml
        run: rustup toolchain install
      # La versión de Rust sale de rust-toolchain.toml (se instala sola en la primera llamada a cargo).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
      # La feature `capture` (capturas del README) no entra en el build normal: se vigila aparte para que no se pudra.
      - name: Clippy (feature capture)
        run: cargo clippy -p tesela-app --all-targets --features capture --locked -- -D warnings
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
      # `--screenshot` sale con error (código 1) si no puede guardar la captura; la prueba corre ANTES de abrir ventana alguna.
      - name: Tests (feature capture, código de salida de --screenshot)
        run: cargo test -p tesela-app --features capture --locked --test screenshot
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          # Esta prueba lanza tesela.exe como proceso hijo: solo corre con TESELA_PROCESS_TESTS=1 (ver el README).
          TESELA_PROCESS_TESTS: "1"
      - name: Tests
        run: cargo test --workspace --locked
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          # Las pruebas que lanzan procesos hijo (copias de tesela.exe y tesela-scan.exe, archivos con nombre de DLL junto a
          # ellos, ventanas) solo corren con esta variable: un antivirus de escritorio puede bloquear ese patrón. Aquí, en un
          # runner efímero, SIEMPRE se ejecutan (README, Desarrollo).
          TESELA_PROCESS_TESTS: "1"
      # Release sin rutas de la máquina en los binarios (y comprobación de que no las llevan), con el runtime de C
      # enlazado de forma estática (.cargo/config.toml): el script exige tesela.exe y tesela-scan.exe y falla si algún
      # .exe importa VCRUNTIME*, MSVCP* o api-ms-win-crt-*.
      # (`RUSTFLAGS` de este job se repite arriba porque el entorno tiene prioridad sobre .cargo/config.toml.)
      - name: Release
        shell: pwsh
        run: ./scripts/build-release.ps1
      # El ejecutable arranca y responde sin crear la ventana (--version no abre la interfaz) y no se pasa del presupuesto
      # de tamaño. PLAN.md §4 fija el objetivo en ≲ 16 MB (unos 15,3 MiB); el CI solo falla por encima de 18 MiB (unos
      # 18,9 MB), un margen deliberado para que una variación del compilador o de las dependencias avise (el tamaño se
      # imprime siempre) sin romper el CI, pero un salto grande sí. No se lanza la
      # interfaz: el runner no tiene GPU (wgpu usaría WARP) y no aporta nada.
      - name: Humo de los ejecutables
        shell: pwsh
        run: |
          $dir = Join-Path (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory 'release'
          # tesela.exe es de interfaz gráfica (subsistema windows): escribe --version por la salida de ERRORES.
          $exe = Join-Path $dir 'tesela.exe'
          $err = Join-Path $env:RUNNER_TEMP 'tesela-version.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardError $err
          if ($p.ExitCode -ne 0) { throw "tesela --version terminó con $($p.ExitCode)" }
          $out = Get-Content -LiteralPath $err -Raw
          Write-Host $out
          if ($out -notmatch '^tesela \d+\.\d+\.\d+') { throw 'tesela --version no imprime la versión' }
          $mib = (Get-Item $exe).Length / 1MB
          Write-Host ('tesela.exe: {0:N1} MiB' -f $mib)
          if ($mib -gt 18) { throw 'tesela.exe supera el presupuesto de tamaño (18 MiB)' }
          # tesela-scan.exe es de consola: escribe --version por la salida ESTÁNDAR.
          $scanOut = Join-Path $env:RUNNER_TEMP 'tesela-scan-version.txt'
          $p = Start-Process -FilePath (Join-Path $dir 'tesela-scan.exe') -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $scanOut
          if ($p.ExitCode -ne 0) { throw "tesela-scan --version terminó con $($p.ExitCode)" }
          $out = Get-Content -LiteralPath $scanOut -Raw
          Write-Host $out
          if ($out -notmatch '^tesela-scan \d+\.\d+\.\d+') { throw 'tesela-scan --version no imprime la versión' }
      # No se ejecuta ningún escaneo de C: en el CI: los tests solo usan árboles sintéticos en %TEMP%.

  # Licencias y avisos de seguridad. También se ejecuta cada semana (schedule).
  deny:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sin argumentos instala el toolchain de rust-toolchain.toml (no se fía de la autoinstalación de la primera cargo).
      - name: Instalar el toolchain de rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      # `--locked`: se comprueba EXACTAMENTE lo que fija Cargo.lock (sin resolver de nuevo las dependencias).
      - name: cargo deny
        run: cargo deny --locked check

  # La versión mínima de Rust (la que fija egui) tiene que seguir compilando.
  msrv:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sin argumentos instala el toolchain de rust-toolchain.toml (no se fía de la autoinstalación de la primera cargo).
      - name: Instalar el toolchain de rust-toolchain.toml
        run: rustup toolchain install
      - name: Instalar Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo +1.95.0 check
        run: cargo +1.95.0 check --workspace --all-targets --locked

  # Comprobación cruzada para ARM64 (se publicará en la v1.0): solo compila, no enlaza ni ejecuta.
  aarch64:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sin argumentos instala el toolchain de rust-toolchain.toml (no se fía de la autoinstalación de la primera cargo).
      - name: Instalar el toolchain de rust-toolchain.toml
        run: rustup toolchain install
      - name: Instalar el target ARM64
        run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (aarch64-pc-windows-msvc)
        run: cargo check --workspace --all-targets --locked --target aarch64-pc-windows-msvc

  # Construye el MSI y el zip portable (sin publicar nada) para detectar roturas del empaquetado en cada PR y en main,
  # y PRUEBA LA INSTALACION de verdad en el runner (que es un administrador desechable): por usuario, para todos, actualizar
  # desde la v0.1.4 publicada, cambio de ambito bloqueado, acceso directo del escritorio. Ver scripts/tests/msi-install.tests.ps1.
  # scripts/build-msi.ps1 vuelve a compilar el release con build-release.ps1 (LTO completo) y valida el paquete.
  msi:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read # `gh attestation verify` de la v0.1.4 que se baja para probar la actualizacion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sin argumentos instala el toolchain de rust-toolchain.toml (no se fía de la autoinstalación de la primera cargo).
      - name: Instalar el toolchain de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Con la version fijada, solo nuget.org (installer/nuget.config) y comprobando el SHA-512 del paquete.
      - name: Instalar WiX
        shell: pwsh
        run: ./scripts/install-wix.ps1 -Version $env:WIX_VERSION
      - name: MSI y zip portable
        shell: pwsh
        run: ./scripts/build-msi.ps1 -OutDir "$env:RUNNER_TEMP/dist"
      # El validador del MSI se prueba con copias manipuladas (en %TEMP%, sin instalar nada).
      - name: Pruebas del validador del MSI
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -Filter '*.msi')
          if ($msi.Count -ne 1) { throw 'se esperaba exactamente un MSI' }
          ./scripts/tests/msi-validate.tests.ps1 -Msi $msi[0].FullName
      # La LOGICA del MSI (condiciones de lanzamiento, carpeta, ambito, idioma, escritorio y los botones de las ventanas de ambito y
      # de carpeta) con una SESION de Windows Installer sin instalar nada (OpenPackage, propiedades sinteticas).
      - name: Pruebas de la logica del MSI (sesion sin instalar)
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -Filter '*.msi')
          if ($msi.Count -ne 1) { throw 'se esperaba exactamente un MSI' }
          ./scripts/tests/msi-logic.tests.ps1 -Msi $msi[0].FullName
      # PRUEBAS DE INSTALACION. Solo aqui: el runner es un administrador con la sesion elevada y desechable, y la prueba se niega a
      # correr fuera de un runner hospedado de GitHub Actions. En local no se instala nada desde un agente.
      # 1) La v0.1.4 publicada se baja de la release y se VERIFICA (procedencia con `gh attestation verify`, igual que el job
      #    `verify` de release.yml, y suma SHA-256) antes de instalarla: es lo que tienen los usuarios y de donde se actualiza.
      - name: Bajar y verificar la v0.1.4 publicada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tesela-v014"
          cd "$RUNNER_TEMP/tesela-v014"
          gh release download v0.1.4 --repo "$REPO" --pattern 'tesela-0.1.4-x64.msi' --pattern 'SHA256SUMS.txt'
          for f in tesela-0.1.4-x64.msi SHA256SUMS.txt; do
            echo "verificando $f"
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref refs/tags/v0.1.4
          done
          grep ' tesela-0.1.4-x64.msi$' SHA256SUMS.txt | sha256sum -c -
      # 2) Instalar, reparar, actualizar, bajar de version (bloqueado), para todos, cambio de ambito (bloqueado), acceso directo
      #    del escritorio y desinstalar sin restos, siempre sin interfaz (/qn). Escribe en el resumen del job que comprobo. NO
      #    prueba la interfaz (ventanas), la peticion de administrador ni las propiedades seguras con un usuario sin privilegios
      #    (el runner es administrador): eso lo prueba una persona (README del instalador).
      - name: Pruebas de instalacion del MSI (por usuario, para todos, actualizacion, cambio de ambito, escritorio)
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -Filter '*.msi')
          if ($msi.Count -ne 1) { throw 'se esperaba exactamente un MSI' }
          ./scripts/tests/msi-install.tests.ps1 -NewMsi $msi[0].FullName -OldMsi "$env:RUNNER_TEMP/tesela-v014/tesela-0.1.4-x64.msi"
      # Si algo falla, los registros de msiexec (sin datos personales: es un runner desechable) ayudan a ver por que.
      - name: Registros de las pruebas de instalacion (solo si fallan)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-install-logs
          path: ${{ runner.temp }}/tesela-install-tests-*/*.log
          retention-days: 7
          if-no-files-found: ignore
