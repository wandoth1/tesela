name: CI

on:
  # Pushes to any branch or tag: nothing is published unless `privacy-history` passes (even outside PRs and `main`).
  # Heavy jobs run only on `main`, tags, and pull requests (see the `if` conditions for build, msrv, and aarch64).
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  schedule:
    # Every Monday: run cargo deny against newly reported security advisories, even when there are no commits.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # PINNED WiX version (same as scripts/build-msi.ps1 and release.yml; checked by scripts/tests/wix-version.tests.ps1).
  WIX_VERSION: "5.0.2"

# Actions are pinned by SHA (the tag is in the comment); Dependabot proposes updates.
jobs:
  # Check that the repository contains no machine-specific data (generic patterns only), and test the checker under
  # both PowerShell 7 and Windows PowerShell 5.1.
  privacy:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: privacy-check (entire tree)
        shell: pwsh
        run: ./scripts/privacy-check.ps1 -All -GenericOnly
      # The .exe import validation in build-release.ps1 uses scripts/check-pe.py; test it with synthetic PEs.
      - name: check-pe.py tests
        shell: pwsh
        run: python -I -m unittest discover -s scripts/tests -p "test_*.py"
      - name: leak-scan tests (local values in binaries)
        shell: pwsh
        run: ./scripts/tests/leak-scan.tests.ps1
      # The WiX version must match in build-msi.ps1, ci.yml, and release.yml; the UpgradeCode must match in the .wxs and script.
      - name: WiX version and UpgradeCode tests
        shell: pwsh
        run: ./scripts/tests/wix-version.tests.ps1
      - name: privacy-check tests (pwsh)
        shell: pwsh
        run: ./scripts/tests/privacy-check.tests.ps1
      - name: privacy-check tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/tests/privacy-check.tests.ps1 -Shell powershell

  # The previous job checks only the checkout (the final tree). This checks what the push or pull request INTRODUCES:
  # every commit message and ALL its blobs, including blobs deleted by a later commit (private data removed in a later
  # commit remains in public history).
  #  * push: github.event.before..github.sha. If `before` is all zeros (first push) or absent from the clone (force push),
  #    check all history through github.sha.
  #  * pull_request: base..head (fetch-depth 0 fetches both endpoints).
  #  * push to a new branch or tag: `before` is all zeros, so check all history through `github.sha`.
  # SHAs are passed through environment variables (never interpolated into the script); the script requires 40 hex
  # characters and peels the destination to its commit (`^{commit}`) in case an annotated tag points to a tag object.
  privacy-history:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: privacy-check (messages and blobs in range)
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $from = $env:PR_BASE
            $to = $env:PR_HEAD
          } else {
            $from = $env:PUSH_BEFORE
            $to = $env:PUSH_AFTER
          }
          $to = (git rev-parse "$($to)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "could not resolve $env:PUSH_AFTER to a commit" }
          Write-Host "range: $from .. $to"
          ./scripts/privacy-check.ps1 -GenericOnly -From $from -To $to
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, installs the toolchain from rust-toolchain.toml (does not rely on cargo's first-run auto-install).
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # The Rust version comes from rust-toolchain.toml (installed automatically on the first cargo invocation).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
      # The `capture` feature (README screenshots) is not part of the normal build; it is checked separately to prevent bit rot.
      - name: Clippy (feature capture)
        run: cargo clippy -p tesela-app --all-targets --features capture --locked -- -D warnings
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
      # `--screenshot` exits with code 1 if it cannot save the screenshot; this test runs BEFORE opening any window.
      - name: Tests (capture feature, --screenshot exit code)
        run: cargo test -p tesela-app --features capture --locked --test screenshot
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          # This test launches tesela.exe as a child process; it runs only with TESELA_PROCESS_TESTS=1 (see the README).
          TESELA_PROCESS_TESTS: "1"
      - name: Tests
        run: cargo test --workspace --locked
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          # Tests that launch child processes (copies of tesela.exe and tesela-scan.exe, DLL-named files beside them,
          # windows) run only with this variable because desktop antivirus may block that pattern. On this ephemeral
          # runner they ALWAYS run (README, Development).
          TESELA_PROCESS_TESTS: "1"
      # Build a release without machine paths in the binaries (and check that none remain), with the C runtime statically
      # linked (.cargo/config.toml). The script requires tesela.exe and tesela-scan.exe and fails if any .exe imports
      # VCRUNTIME*, MSVCP*, or api-ms-win-crt-*.
      # (This job repeats `RUSTFLAGS` above because the environment takes precedence over .cargo/config.toml.)
      - name: Release
        shell: pwsh
        run: ./scripts/build-release.ps1
      # The executable starts and responds without opening a window (--version does not open the UI) and stays within
      # the size budget. PLAN.md §4 sets a target of ≲ 16 MB (about 15.3 MiB); CI fails only above 18 MiB (about 18.9 MB),
      # leaving room for compiler or dependency variation while still reporting the size. A large increase still fails.
      # The UI is not launched: the runner has no GPU (wgpu would use WARP), so this adds no value.
      - name: Executable smoke tests
        shell: pwsh
        run: |
          $dir = Join-Path (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory 'release'
          # tesela.exe uses the Windows GUI subsystem, so it writes --version to STDERR.
          $exe = Join-Path $dir 'tesela.exe'
          $err = Join-Path $env:RUNNER_TEMP 'tesela-version.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardError $err
          if ($p.ExitCode -ne 0) { throw "tesela --version exited with $($p.ExitCode)" }
          $out = Get-Content -LiteralPath $err -Raw
          Write-Host $out
          if ($out -notmatch '^tesela \d+\.\d+\.\d+') { throw 'tesela --version did not print the version' }
          $mib = (Get-Item $exe).Length / 1MB
          Write-Host ('tesela.exe: {0:N1} MiB' -f $mib)
          if ($mib -gt 18) { throw 'tesela.exe exceeds the size budget (18 MiB)' }
          # tesela-scan.exe uses the console subsystem, so it writes --version to STDOUT.
          $scanOut = Join-Path $env:RUNNER_TEMP 'tesela-scan-version.txt'
          $p = Start-Process -FilePath (Join-Path $dir 'tesela-scan.exe') -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $scanOut
          if ($p.ExitCode -ne 0) { throw "tesela-scan --version exited with $($p.ExitCode)" }
          $out = Get-Content -LiteralPath $scanOut -Raw
          Write-Host $out
          if ($out -notmatch '^tesela-scan \d+\.\d+\.\d+') { throw 'tesela-scan --version did not print the version' }
      # CI does not scan C:; tests use synthetic trees under %TEMP% only.

  # License and security advisory checks. Also runs weekly (schedule).
  deny:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, installs the toolchain from rust-toolchain.toml (does not rely on cargo's first-run auto-install).
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      # `--locked`: check EXACTLY what Cargo.lock pins (do not resolve dependencies again).
      - name: cargo deny
        run: cargo deny --locked check

  # The minimum supported Rust version (pinned by egui) must continue to compile.
  msrv:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, installs the toolchain from rust-toolchain.toml (does not rely on cargo's first-run auto-install).
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo +1.95.0 check
        run: cargo +1.95.0 check --workspace --all-targets --locked

  # ARM64 cross-check (planned for v1.0): compile only; do not link or run.
  aarch64:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, installs the toolchain from rust-toolchain.toml (does not rely on cargo's first-run auto-install).
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install ARM64 target
        run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo check (aarch64-pc-windows-msvc)
        run: cargo check --workspace --all-targets --locked --target aarch64-pc-windows-msvc

  # Build the MSI and portable zip (without publishing) to catch packaging regressions on every PR and on main,
  # and perform REAL INSTALLATION TESTS on the runner (a disposable administrator): per-user, per-machine, upgrade
  # from the published v0.1.4, blocked scope change, and desktop shortcut. See scripts/tests/msi-install.tests.ps1.
  # scripts/build-msi.ps1 rebuilds the release with build-release.ps1 (full LTO) and validates the package.
  msi:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read # Verify the downloaded v0.1.4 attestation before testing upgrades.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, installs the toolchain from rust-toolchain.toml (does not rely on cargo's first-run auto-install).
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # With the pinned version, use nuget.org only (installer/nuget.config) and verify the package SHA-512.
      - name: Install WiX
        shell: pwsh
        run: ./scripts/install-wix.ps1 -Version $env:WIX_VERSION
      - name: MSI and portable zip
        shell: pwsh
        run: ./scripts/build-msi.ps1 -OutDir "$env:RUNNER_TEMP/dist"
      # Test the MSI validator with modified copies (%TEMP%; nothing is installed).
      - name: MSI validator tests
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -Filter '*.msi')
          if ($msi.Count -ne 1) { throw 'expected exactly one MSI' }
          ./scripts/tests/msi-validate.tests.ps1 -Msi $msi[0].FullName
      # Test MSI LOGIC (launch conditions, directory, scope, language, desktop shortcut, and scope/directory dialog
      # buttons) using a Windows Installer SESSION without installing anything (OpenPackage, synthetic properties).
      - name: MSI logic tests (session without installation)
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -Filter '*.msi')
          if ($msi.Count -ne 1) { throw 'expected exactly one MSI' }
          ./scripts/tests/msi-logic.tests.ps1 -Msi $msi[0].FullName
      # INSTALLATION TESTS. Only here: the runner is a disposable administrator with an elevated session, and the test refuses to
      # run outside a GitHub Actions hosted runner. Nothing is installed locally by an agent.
      # 1) Download the published v0.1.4 from the release and VERIFY it (provenance with `gh attestation verify`, as in the
      #    `verify` job in release.yml, plus SHA-256) before installing it: this is what users have and upgrade from.
      - name: Download and verify the published v0.1.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'tesela-v014'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location -LiteralPath $dir
          gh release download v0.1.4 --repo $env:REPO --pattern 'tesela-0.1.4-x64.msi' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed ($LASTEXITCODE)" }
          foreach ($f in 'tesela-0.1.4-x64.msi', 'SHA256SUMS.txt') {
            Write-Host "verifying $f"
            gh attestation verify $f --repo $env:REPO --signer-workflow "$env:REPO/.github/workflows/release.yml" --source-ref refs/tags/v0.1.4
            if ($LASTEXITCODE -ne 0) { throw "gh attestation verify failed for $f ($LASTEXITCODE)" }
          }
          $line = @(Get-Content -LiteralPath SHA256SUMS.txt | Where-Object { $_ -match '^[0-9a-f]{64}\s+tesela-0\.1\.4-x64\.msi$' })
          if ($line.Count -ne 1) { throw 'SHA256SUMS.txt does not contain exactly one MSI line' }
          $expected = ($line[0] -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath tesela-0.1.4-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "MSI SHA-256 mismatch ($actual versus $expected)" }
          Write-Host "SHA-256 verified: $actual"
      # 2) Install, repair, upgrade, downgrade (blocked), per-machine install, scope change (blocked), desktop shortcut,
      #    and clean uninstall, always without UI (/qn). Write the checks performed to the job summary. This does NOT
      #    test the UI (dialogs), administrator prompt, or secure properties with an unprivileged user
      #    (the runner is an administrator); a person tests those (installer README).
      - name: MSI installation tests (per-user, per-machine, upgrade, scope change, desktop)
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -Filter '*.msi')
          if ($msi.Count -ne 1) { throw 'expected exactly one MSI' }
          ./scripts/tests/msi-install.tests.ps1 -NewMsi $msi[0].FullName -OldMsi "$env:RUNNER_TEMP/tesela-v014/tesela-0.1.4-x64.msi"
      # If anything fails, msiexec logs (no personal data: this is a disposable runner) help explain why.
      - name: MSI installation logs (only on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-install-logs
          path: ${{ runner.temp }}/tesela-install-tests-*/*.log
          retention-days: 7
          if-no-files-found: ignore
