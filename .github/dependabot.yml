version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Crates that only work together arrive in one pull request. The `spike/` workspace is historical and is not
    # maintained, so it has no entry here.
    groups:
      egui:
        patterns:
          - "egui"
          - "egui*"
          - "eframe"
      windows:
        patterns:
          - "windows"
          - "windows-*"
