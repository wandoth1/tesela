# Statically link the C runtime on Windows: without this, the .exe imports VCRUNTIME140.dll and api-ms-win-crt-*.
# On Windows 10/11, the UCRT is part of the system; static linking avoids depending on the redistributable VC++ runtime
# (the per-user installer does not require elevation and cannot install it).
# `scripts/build-release.ps1` repeats this flag in CARGO_ENCODED_RUSTFLAGS (which takes precedence over this file and is
# not combined with it) and checks each .exe's import table. `/Brepro` makes linking reproducible (no timestamp): the
# same commit produces the same .exe, byte for byte, in any folder.
[target.'cfg(windows)']
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/Brepro"]
