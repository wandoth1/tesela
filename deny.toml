# cargo-deny (formato 0.20). Se ejecuta con `cargo deny check` en el CI.
# Nota: solo cubre el workspace de la raíz; `spike/` es independiente y no se comprueba.

[graph]
# El producto es solo Windows x64 (ARM64 llegará en la v1.0).
targets = ["x86_64-pc-windows-msvc"]
# Todas las features (tambien `capture` de tesela-app, que no entra en el build normal): sus dependencias tambien se
# comprueban en licencias y avisos de seguridad.
all-features = true

[advisories]
ignore = []

[licenses]
# Licencias permitidas: compatibles con distribuir bajo MIT OR Apache-2.0. Solo están las que hoy usa el árbol de
# dependencias; cada licencia nueva (por ejemplo ISC, Zlib o BSD con egui) se añade a propósito cuando aparezca.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # Incremento 2 (egui, wgpu, winit, arboard...): cada una la exige al menos un crate sin alternativa en OR.
    "BSL-1.0",        # clipboard-win, error-code (portapapeles)
    "ISC",            # libloading (wgpu-hal)
    "Zlib",           # foldhash (hashbrown, wgpu); los demas Zlib del arbol tienen alternativa MIT o Apache-2.0
]
confidence-threshold = 0.8

[bans]
# Se toleran versiones duplicadas (p. ej. la familia `windows-*`/`windows-sys` que arrastran las dependencias).
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
